name: student_ai_companion
description: "Student AI Companion — an emotional AI companion app for college students."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.2.0
  firebase_messaging: ^15.0.3
  firebase_storage: ^12.1.1
  google_sign_in: ^6.2.1

  # Local databases
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # UI / Design system
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  rive: ^0.13.13
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Notifications / Background
  flutter_local_notifications: ^17.2.1+2
  workmanager: ^0.5.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Overlay assistant
  system_alert_window: ^2.0.4
  flutter_overlay_window: ^0.4.5

  # AI / Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  http: ^1.2.2

  # Media / Files
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  pdf: ^3.11.0
  syncfusion_flutter_pdfviewer: ^26.2.7

  # Calendar / Location
  device_calendar: ^4.3.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.3
  logger: ^2.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  isar_generator: ^3.1.0+1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

  # Testing
  mocktail: ^1.0.4
  riverpod_test: ^0.0.5+2

flutter:
  uses-material-design: true

  assets:
    - assets/svg/onboarding/
    - assets/svg/empty_states/
    - assets/svg/icons/
    - assets/lottie/loading.json
    - assets/lottie/success.json
    - assets/lottie/error.json
    - assets/lottie/confetti.json
    - assets/lottie/forest_growth.json
    - assets/rive/ai_orb.riv
    - assets/rive/orb_states.riv

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
          
